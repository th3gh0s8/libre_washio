name: washio
description: A new Flutter project.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.2.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.2
  country_code_picker: ^3.0.0
  http: ^1.2.0
  shared_preferences: ^2.2.2
  google_maps_flutter: ^2.5.3
  geolocator: ^11.0.0
  geocoding: ^3.0.0
  provider: ^6.1.2
  flutter_polyline_points: ^2.0.0
  permission_handler: ^11.3.0
  flutter_launcher_icons: ^0.13.1
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

# Configuration for flutter_launcher_icons
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  # Updated to use the new light logo
  image_path: "assets/images/logo_light.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/images/logo_light.png"
    background_color: "#000000"
    theme_color: "#000000"
  windows:
    generate: true
    image_path: "assets/images/logo_light.png"
    icon_size: 48
  macos:
    generate: true
    image_path: "assets/images/logo_light.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo_dark.png
    - assets/images/logo_light.png
