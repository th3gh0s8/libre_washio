# This workflow checks out code, installs dependencies, runs tests, and builds the app.

name: Flutter CI

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # 1. Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4

      # 2. Sets up the Flutter SDK
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # 3. Gets Flutter dependencies
      - name: Get Flutter dependencies
        run: flutter pub get

      # 4. Analyzes the project source code. This will now only fail on errors.
      - name: Analyze project source
        run: flutter analyze

      # 5. Runs unit tests
      - name: Run tests
        run: flutter test

      # 6. Builds the Android APK
      - name: Build Android APK
        run: flutter build apk --debug
